# Knobs the outer agent may change (DESIGN.md §4 "Extract the knobs scattered in code into config.yaml")
#
# Anything not here is immutable; changing it has no effect:
#   translator_mode        hard-coded cf-struct-replay (changing it breaks the backend outright)
#   KLEE max-time          controlled by run_eval's --fast/--full, part of the metric definition
#   scoring script score.py  metric definitions, root-owned

# Inner translation model. This is the llm-based branch: the default is one model
# request per unit (gpt-5-mini, claude-sonnet, gpt-5, gemini-flash, ...).
# opencode:<provider/model> still works and translates every type batch and every
# function with an OpenCode agent that greps the C for how it is used; main is
# the agent-only line.
# Open-model roster: openrouter/deepseek/deepseek-v4-pro-0813, .../deepseek-v4-flash-0731,
#                    openrouter/qwen/qwen3.8-2.4t-a95b, openrouter/qwen/qwen3.8-27b
llm_mode: gpt-5-mini
openrouter_provider:          # OpenRouter host(s) to pin, comma-separated in order of preference (e.g. siliconflow); empty = OpenRouter routes
# The test-case backend translates a codebase's tests with an OpenCode agent only,
# so it keeps the agent model main uses; the tests then score this branch's
# translation the same way they score main's.
testcase_llm_mode: opencode:openrouter/deepseek/deepseek-v4-flash-0731
agent_max_steps: 40           # model round-trips per OpenCode invocation, tool calls included
codebase: ./inputs-complex/libcsv
compilation_retries: 5        # max times rustc errors are fed back to the LLM
struct_retries: 5             # struct remediation retry count
